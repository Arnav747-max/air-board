<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Blackboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#board {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
    touch-action: none;
}

#camera {
    display: none;
}

#pointer {
    position: fixed;
    width: 18px;
    height: 18px;
    background: yellow;
    border: 2px solid white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    display: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px yellow;
}

#topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    z-index: 20;
    pointer-events: none;
}

#title {
    font-size: 18px;
    font-weight: bold;
}

#controls {
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

button {
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    background: #292929;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

button:active {
    background: #555;
}

#settingsPanel {
    position: fixed;
    top: 65px;
    right: 12px;
    width: 240px;
    padding: 16px;
    background: rgba(30,30,30,0.96);
    color: white;
    border-radius: 12px;
    z-index: 30;
    display: none;
}

#settingsPanel.open {
    display: block;
}

.setting {
    margin-bottom: 18px;
}

.setting label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 9px;
}

.setting input {
    width: 100%;
    accent-color: yellow;
}

#status {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 12px;
    background: rgba(30,30,30,0.7);
    padding: 7px 12px;
    border-radius: 20px;
    z-index: 15;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="board"></canvas>
<video id="camera" autoplay playsinline></video>

<div id="pointer"></div>

<div id="topbar">
    <div id="title">Air Blackboard</div>

    <div id="controls">
        <button id="clearButton">Clear</button>
        <button id="settingsButton">▼</button>
    </div>
</div>

<div id="settingsPanel">

    <div class="setting">
        <label>
            <span>Pen Width</span>
            <span id="widthValue">5 px</span>
        </label>
        <input id="penWidth"
               type="range"
               min="1"
               max="20"
               value="5">
    </div>

    <div class="setting">
        <label>
            <span>Smoothness</span>
            <span id="smoothValue">80%</span>
        </label>
        <input id="smoothness"
               type="range"
               min="0"
               max="100"
               value="80">
    </div>

    <div class="setting">
        <label>
            <span>Movement Sensitivity</span>
            <span id="sensitivityValue">1.0×</span>
        </label>
        <input id="sensitivity"
               type="range"
               min="0.5"
               max="2.5"
               step="0.1"
               value="1">
    </div>

</div>

<div id="status">Starting camera...</div>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const video = document.getElementById("camera");
const pointer = document.getElementById("pointer");
const statusText = document.getElementById("status");

const penWidth = document.getElementById("penWidth");
const smoothness = document.getElementById("smoothness");
const sensitivity = document.getElementById("sensitivity");

const widthValue = document.getElementById("widthValue");
const smoothValue = document.getElementById("smoothValue");
const sensitivityValue = document.getElementById("sensitivityValue");

const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.getElementById("settingsPanel");

let handLandmarker;
let lastVideoTime = -1;

let isDrawing = false;
let isPinching = false;
let fistHandled = false;

let lastPoint = null;
let pointerPoint = null;
let pointerTarget = null;
let previousRawPoint = null;

let lastFistTime = 0;

const FIST_COOLDOWN = 900;

// Canvas setup

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// Settings

function getPenWidth() {
    return Number(penWidth.value);
}

function getSmoothing() {
    const value = Number(smoothness.value);

    // Higher smoothness means slower, smoother movement.
    return 0.65 - (value / 100) * 0.57;
}

function getSensitivity() {
    return Number(sensitivity.value);
}

penWidth.addEventListener("input", () => {
    widthValue.textContent = getPenWidth() + " px";
});

smoothness.addEventListener("input", () => {
    smoothValue.textContent = smoothness.value + "%";
});

sensitivity.addEventListener("input", () => {
    sensitivityValue.textContent =
        getSensitivity().toFixed(1) + "×";
});


// Settings dropdown

settingsButton.addEventListener("click", () => {
    settingsPanel.classList.toggle("open");

    settingsButton.textContent =
        settingsPanel.classList.contains("open") ? "▲" : "▼";
});

document.addEventListener("pointerdown", event => {
    if (
        !settingsPanel.contains(event.target) &&
        event.target !== settingsButton
    ) {
        settingsPanel.classList.remove("open");
        settingsButton.textContent = "▼";
    }
});


// Clear board

function clearBoard() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    resetGesture();
}

document.getElementById("clearButton")
    .addEventListener("click", clearBoard);


// Reset drawing gesture

function resetGesture() {
    isDrawing = false;
    isPinching = false;
    fistHandled = false;
    lastPoint = null;
}


// Distance between two landmarks

function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);
}


// Check whether fingers are folded

function isFist(lm) {
    const wrist = lm[0];

    const fingers = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
    ];

    let folded = 0;

    for (const [tip, pip] of fingers) {
        if (
            distance(lm[tip], wrist) <
            distance(lm[pip], wrist) * 1.12
        ) {
            folded++;
        }
    }

    return folded >= 4;
}


// Draw line

function drawLine(point) {
    if (!lastPoint) {
        lastPoint = {
            x: point.x,
            y: point.y
        };
        return;
    }

    ctx.beginPath();

    ctx.moveTo(lastPoint.x, lastPoint.y);
    ctx.lineTo(point.x, point.y);

    ctx.strokeStyle = "white";
    ctx.lineWidth = getPenWidth();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.stroke();

    lastPoint = {
        x: point.x,
        y: point.y
    };
}


// Update pointer position using relative movement

function updatePointer(index) {

    // Mirror horizontal movement.
    const rawPoint = {
        x: (1 - index.x) * window.innerWidth,
        y: index.y * window.innerHeight
    };

    // First detection: place pointer at fingertip.
    if (!previousRawPoint || !pointerTarget || !pointerPoint) {

        previousRawPoint = {
            x: rawPoint.x,
            y: rawPoint.y
        };

        pointerTarget = {
            x: rawPoint.x,
            y: rawPoint.y
        };

        pointerPoint = {
            x: rawPoint.x,
            y: rawPoint.y
        };

    } else {

        // Calculate how far the fingertip moved since
        // the previous frame.
        const dx = rawPoint.x - previousRawPoint.x;
        const dy = rawPoint.y - previousRawPoint.y;

        const movement = Math.hypot(dx, dy);

        // Ignore extremely small tracking noise.
        if (movement > 0.6) {

            const gain = getSensitivity();

            // Multiply relative movement by sensitivity.
            pointerTarget.x += dx * gain;
            pointerTarget.y += dy * gain;
        }

        previousRawPoint.x = rawPoint.x;
        previousRawPoint.y = rawPoint.y;
    }

    // Keep pointer inside screen.
    pointerTarget.x = Math.max(
        0,
        Math.min(window.innerWidth, pointerTarget.x)
    );

    pointerTarget.y = Math.max(
        0,
        Math.min(window.innerHeight, pointerTarget.y)
    );

    // Smooth pointer movement.
    const alpha = getSmoothing();

    pointerPoint.x +=
        (pointerTarget.x - pointerPoint.x) * alpha;

    pointerPoint.y +=
        (pointerTarget.y - pointerPoint.y) * alpha;

    pointer.style.left = pointerPoint.x + "px";
    pointer.style.top = pointerPoint.y + "px";

    pointer.style.display = "block";

    return pointerPoint;
}


// Process detected hand

function processHand(lm) {

    const index = lm[8];
    const thumb = lm[4];

    const pinchDistance = distance(index, thumb);

    // Normalize pinch distance using hand size.
    const handSize = Math.max(
        distance(lm[0], lm[9]),
        0.001
    );

    const normalizedPinch = pinchDistance / handSize;

    // Stable pinch thresholds.
    const PINCH_ENTER = 0.25;
    const PINCH_EXIT = 0.34;

    // Update pointer.
    const point = updatePointer(index);

    // Fist detection.
    if (isFist(lm)) {

        isDrawing = false;
        isPinching = false;
        lastPoint = null;

        const now = Date.now();

        if (
            !fistHandled &&
            now - lastFistTime > FIST_COOLDOWN
        ) {
            clearBoard();

            fistHandled = true;
            lastFistTime = now;
        }

        statusText.textContent = "Fist detected - Board cleared";
        return;
    }

    fistHandled = false;

    // Pinch detection with hysteresis.
    if (!isPinching && normalizedPinch < PINCH_ENTER) {
        isPinching = true;
    }

    if (isPinching && normalizedPinch > PINCH_EXIT) {
        isPinching = false;
    }

    // Drawing.
    if (isPinching) {

        if (!isDrawing) {
            isDrawing = true;
            lastPoint = {
                x: point.x,
                y: point.y
            };
        }

        drawLine(point);

        statusText.textContent = "Drawing";
    } else {

        isDrawing = false;
        lastPoint = null;

        statusText.textContent = "Hand detected - Pinch to draw";
    }
}


// Start MediaPipe

async function initializeHandTracking() {

    try {

        statusText.textContent = "Loading hand tracking...";

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const model =
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

        try {

            handLandmarker = await HandLandmarker.createFromOptions(
                vision,
                {
                    baseOptions: {
                        modelAssetPath: model,
                        delegate: "GPU"
                    },

                    runningMode: "VIDEO",
                    numHands: 1,

                    minHandDetectionConfidence: 0.55,
                    minHandPresenceConfidence: 0.55,
                    minTrackingConfidence: 0.55
                }
            );

        } catch (gpuError) {

            console.warn("GPU unavailable. Using CPU.", gpuError);

            handLandmarker = await HandLandmarker.createFromOptions(
                vision,
                {
                    baseOptions: {
                        modelAssetPath: model,
                        delegate: "CPU"
                    },

                    runningMode: "VIDEO",
                    numHands: 1,

                    minHandDetectionConfidence: 0.55,
                    minHandPresenceConfidence: 0.55,
                    minTrackingConfidence: 0.55
                }
            );
        }

        await startCamera();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Error loading hand tracking. Check internet connection.";
    }
}


// Start camera

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",

                width: {
                    ideal: 480
                },

                height: {
                    ideal: 360
                },

                frameRate: {
                    ideal: 30,
                    max: 30
                }
            },

            audio: false
        });

        video.srcObject = stream;

        await video.play();

        statusText.textContent = "Camera ready - Show your hand";

        requestAnimationFrame(detectHands);

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera error. Allow camera permission and reload.";
    }
}


// Hand detection loop

function detectHands() {

    if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime = video.currentTime;

        const results = handLandmarker.detectForVideo(
            video,
            performance.now()
        );

        if (
            results.landmarks &&
            results.landmarks.length > 0
        ) {

            processHand(results.landmarks[0]);

        } else {

            // Reset movement reference when hand disappears.
            pointer.style.display = "none";

            previousRawPoint = null;
            pointerTarget = null;
            pointerPoint = null;

            resetGesture();

            statusText.textContent = "Show your hand";
        }
    }

    requestAnimationFrame(detectHands);
}


// Initialize

initializeHandTracking();

</script>

</body>
</html>
