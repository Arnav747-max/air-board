
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Air Blackboard</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #board {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      touch-action: none;
    }

    #camera {
      display: none;
    }

    #pointer {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffeb00;
      border: 2px solid white;
      box-shadow: 0 0 10px #ffeb00;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      display: none;
      will-change: left, top;
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 5;
    }

    #title {
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 1px 5px #555;
    }

    #status {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    button {
      pointer-events: auto;
      border: 1px solid #444;
      border-radius: 10px;
      background: #181818;
      color: white;
      padding: 11px 15px;
      font-size: 14px;
    }

    #hint {
      position: fixed;
      bottom: 22px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: 13px;
      color: #999;
      pointer-events: none;
      z-index: 5;
    }

    #start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(85%, 340px);
      padding: 25px;
      border-radius: 18px;
      background: #151515;
      text-align: center;
      z-index: 20;
    }

    #start button {
      margin-top: 12px;
      background: white;
      color: black;
      font-weight: bold;
    }

    #start p {
      color: #bbb;
      line-height: 1.5;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <canvas id="board"></canvas>
  <div id="pointer"></div>
  <video id="camera" autoplay playsinline muted></video>

  <div id="topbar">
    <div>
      <div id="title">✍ Air Blackboard</div>
      <div id="status">Camera not started</div>
    </div>
    <button id="clear">Clear board</button>
  </div>

  <div id="hint">
    🟡 Pointer · Pinch to draw · Release to stop · Fist to clear
  </div>

  <div id="start">
    <h2>Air Blackboard</h2>
    <p>
      Point with your index finger and pinch your thumb
      and index finger to draw.
    </p>
    <button id="startBtn">Start Camera</button>
    <p id="error"></p>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d", {
      alpha: false,
      desynchronized: true
    });

    const video = document.getElementById("camera");
    const pointer = document.getElementById("pointer");
    const status = document.getElementById("status");
    const startPanel = document.getElementById("start");
    const startBtn = document.getElementById("startBtn");
    const errorBox = document.getElementById("error");

    let handTracker = null;
    let stream = null;
    let running = false;
    let starting = false;
    let animationId = 0;

    let drawing = false;
    let pinching = false;
    let lastPoint = null;
    let smoothPoint = null;
    let pointerPoint = null;

    let wasFist = false;
    let lastClearTime = 0;
    let lastVideoTime = -1;

    // Camera settings
    const CAMERA_WIDTH = 480;
    const CAMERA_HEIGHT = 360;

    // Lower values smooth more but add some delay.
    const POINTER_SMOOTHING = 0.18;
    const DRAWING_SMOOTHING = 0.22;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#ffffff";
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function resetGesture() {
      drawing = false;
      pinching = false;
      lastPoint = null;
      smoothPoint = null;
      // Keep pointerPoint so the yellow dot stays continuous.
    }

    function clearBoard() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      resetGesture();
    }

    document.getElementById("clear").addEventListener(
      "click", clearBoard
    );

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isFist(lm) {
      const wrist = lm[0];
      const fingers = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
      ];

      let curled = 0;

      for (const [tip, pip] of fingers) {
        if (
          distance(lm[tip], wrist) <
          distance(lm[pip], wrist) * 1.12
        ) {
          curled++;
        }
      }

      return curled >= 4;
    }

    function drawSegment(a, b) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function processHand(lm) {
      const thumb = lm[4];
      const index = lm[8];

      const handSize = Math.max(
        distance(lm[0], lm[9]), 0.001
      );

      const pinchDistance =
        distance(thumb, index) / handSize;

      // Raw fingertip target, mirrored for the selfie camera.
      const target = {
        x: (1 - index.x) * innerWidth,
        y: index.y * innerHeight
      };

      // Smooth the yellow pointer itself.
      if (!pointerPoint) {
        pointerPoint = { ...target };
      } else {
        pointerPoint.x +=
          (target.x - pointerPoint.x) * POINTER_SMOOTHING;

        pointerPoint.y +=
          (target.y - pointerPoint.y) * POINTER_SMOOTHING;
      }

      pointer.style.display = "block";
      pointer.style.left = pointerPoint.x + "px";
      pointer.style.top = pointerPoint.y + "px";

      // Pinch hysteresis prevents rapid switching.
      if (pinching) {
        if (pinchDistance > 0.34) pinching = false;
      } else {
        if (pinchDistance < 0.25) pinching = true;
      }

      const fist = isFist(lm);
      const now = performance.now();

      if (
        fist &&
        !wasFist &&
        now - lastClearTime > 900
      ) {
        clearBoard();
        lastClearTime = now;
        status.textContent = "✊ Board cleared";
      }

      wasFist = fist;

      if (fist) {
        resetGesture();
        status.textContent = "✊ Fist detected";
        return;
      }

      if (!pinching) {
        resetGesture();
        status.textContent = "🟡 Pointer ready — pinch to draw";
        return;
      }

      // Draw using the same smoothed position as the pointer.
      // This prevents the white line from separating from the dot.
      if (!smoothPoint) {
        smoothPoint = { ...pointerPoint };
      } else {
        smoothPoint.x +=
          (pointerPoint.x - smoothPoint.x) * DRAWING_SMOOTHING;

        smoothPoint.y +=
          (pointerPoint.y - smoothPoint.y) * DRAWING_SMOOTHING;
      }

      const drawPoint = { ...smoothPoint };

      if (lastPoint && drawing) {
        drawSegment(lastPoint, drawPoint);
      }

      lastPoint = drawPoint;
      drawing = true;
      status.textContent = "✍ Drawing";
    }

    async function createTracker(vision, delegate) {
      return HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/" +
            "hand_landmarker/hand_landmarker/float16/1/" +
            "hand_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.55
      });
    }

    async function startCamera() {
      if (starting || running) return;

      starting = true;
      startBtn.disabled = true;
      startBtn.textContent = "Loading...";
      errorBox.textContent = "";

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Camera requires HTTPS or localhost.");
        }

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        // Try GPU, then CPU if GPU initialization fails.
        try {
          handTracker = await createTracker(vision, "GPU");
        } catch (gpuError) {
          console.warn("GPU unavailable; trying CPU", gpuError);
          handTracker = await createTracker(vision, "CPU");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: CAMERA_WIDTH },
            height: { ideal: CAMERA_HEIGHT },
            frameRate: { ideal: 24, max: 30 }
          }
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        startPanel.style.display = "none";
        status.textContent = "Show your hand to the camera";
        lastVideoTime = -1;
        pointerPoint = null;

        animationId = requestAnimationFrame(trackHands);

      } catch (err) {
        console.error(err);
        running = false;

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        if (handTracker) {
          handTracker.close();
          handTracker = null;
        }

        pointer.style.display = "none";
        pointerPoint = null;

        errorBox.textContent =
          "Could not start: " + err.message +
          " Check your internet and camera permission.";

        startBtn.disabled = false;
        startBtn.textContent = "Try Again";

      } finally {
        starting = false;
      }
    }

    function trackHands() {
      if (!running) return;

      try {
        if (
          handTracker &&
          video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
          video.videoWidth > 0 &&
          video.currentTime !== lastVideoTime
        ) {
          lastVideoTime = video.currentTime;

          const result = handTracker.detectForVideo(
            video, performance.now()
          );

          if (result.landmarks && result.landmarks.length > 0) {
            processHand(result.landmarks[0]);
          } else {
            resetGesture();
            wasFist = false;
            pointer.style.display = "none";
            pointerPoint = null;
            status.textContent = "No hand detected";
          }
        }
      } catch (err) {
        console.error("Tracking error:", err);
        resetGesture();
        pointer.style.display = "none";
        pointerPoint = null;
        status.textContent = "Tracking error — retrying";
      }

      if (running) {
        animationId = requestAnimationFrame(trackHands);
      }
    }

    startBtn.addEventListener("click", startCamera);

    window.addEventListener("pagehide", () => {
      running = false;
      cancelAnimationFrame(animationId);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (handTracker) {
        handTracker.close();
        handTracker = null;
      }
    });
  </script>
</body>
</html>
